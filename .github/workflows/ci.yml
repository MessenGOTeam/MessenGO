name: MessenGO CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate-infrastructure:
    name: Validate Docker & Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "docker-compose.yml syntax is valid."

  backend-check:
    name: Backend Microservices Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Backend Directory & Run Build/Tests
        run: |
          if [ -d "backend" ]; then
            echo "Backend directory found. Running verification..."
            cd backend
            if [ -f "package.json" ]; then
              npm ci || npm install
              npm run lint --if-present
              npm run build --if-present
              npm test --if-present
            fi
          else
            echo "Backend directory not yet created. Skipping backend checks."
          fi

  android-check:
    name: Android App Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Android Directory & Verify Gradle
        run: |
          if [ -d "android" ]; then
            echo "Android directory found. Running gradle checks..."
            cd android
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew testDebugUnitTest --no-daemon || true
            fi
          else
            echo "Android directory not yet created. Skipping Android checks."
          fi
